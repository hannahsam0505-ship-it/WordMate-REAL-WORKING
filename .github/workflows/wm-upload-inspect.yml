name: WM Upload Inspect
on:
  push:
    branches: [wm-upload-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect prepared payload
        shell: bash
        run: |
          set -euo pipefail
          cat .wm-upload/chunk1.b64gz .wm-upload/chunk2.b64gz .wm-upload/chunk3.b64gz .wm-upload/chunk4.b64gz .wm-upload/chunk5.b64gz > /tmp/payload.b64
          base64 -d /tmp/payload.b64 | gzip -dc > /tmp/payload.txt
          echo "BYTES=$(wc -c < /tmp/payload.txt) LINES=$(wc -l < /tmp/payload.txt)"
          echo "--- FIRST ---"
          head -c 220 /tmp/payload.txt | tr '\n' ' '
          echo
          echo "--- LAST ---"
          tail -c 220 /tmp/payload.txt | tr '\n' ' '
          echo
